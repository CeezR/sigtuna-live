<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigtuna</title>
<style>
html,body{margin:0;height:100%;background:#efece4}
body{display:flex;align-items:center;justify-content:center}
.map{position:relative;width:min(100vw,calc(100vh*2400/1950));aspect-ratio:2400/1950}
.map img{width:100%;height:100%;display:block}
.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#d0021b;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);box-sizing:border-box}
.dot.approx{background:rgba(208,2,27,.55)}
.credit{position:fixed;right:4px;bottom:2px;font:10px sans-serif;color:#888}
</style>
<script src="m0.js"></script>
<script src="m1.js"></script>
<script src="m2.js"></script>
<script src="m3.js"></script>
<script src="m4.js"></script>
<script src="m5.js"></script>
<script src="m6.js"></script>
<script src="m7.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  var b="";
  for(var i=0;i<8;i++) b+=window["__m"+i];
  document.getElementById("mapimg").src="data:image/webp;base64,"+b;
});
</script>
</head>
<body><div class="map"><img id="mapimg" alt="Sigtuna map" width="1600" height="1300">
